# Render Blueprint: только Telegram-бот (не Next.js сайт).
# Dashboard → New → Blueprint → repo illucards, или привязать к существующему сервису.
services:
  - type: web
    name: illucards-telegram-bot
    runtime: python
    plan: free
    rootDir: telegram_bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ILLUCARDS_SITE_ORIGIN
        value: https://www.illucards.by
      - key: ILLUCARDS_ORDER_UPDATE_SECRET
        sync: false
      - key: TELEGRAM_SYNC_API_SECRET
        sync: false
      - key: ILLUCARDS_LOGIN_CODE_SYNC_SECRET
        sync: false
